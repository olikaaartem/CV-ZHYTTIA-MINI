<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV ЖИТТЯ — Люби · мрій · дій</title><link rel="stylesheet" href="style.css?v=2"></head><body>
<section id="welcome" class="welcome"><div class="welcome-content"><img src="images/logo.png" alt="CV ЖИТТЯ — Люби, мрій, дій"><button id="begin" class="primary big">Почати гру →</button></div></section>
<section id="wizard" class="wizard" hidden><aside class="guide"><img src="images/raifik.png" alt="Райфик"><div class="speech"><b>Райфик</b><p id="guideText" aria-live="polite"></p></div></aside><div class="wizard-panel"><nav id="steps" aria-label="Етапи підготовки"></nav><div id="setupContent"></div><footer><button id="back">← Назад</button><button id="continue" class="primary">Далі →</button></footer></div></section>
<main id="game" hidden><section id="field" class="field"><div id="board"><img class="center-logo" src="images/logo.png" alt="CV ЖИТТЯ"></div></section><aside class="sidebar"><section class="turn"><p class="eyebrow">ЗАРАЗ ХОДИТЬ</p><div id="currentHero"></div><div id="dice" class="dice" aria-live="polite">⚄</div><p id="turnHint" role="status"></p></section><section class="team"><p class="eyebrow">КОМАНДА</p><div id="roster"></div></section><section class="controls"><button id="roll" class="primary">Кинути кубик</button><button id="draw" class="primary" hidden>Витягнути картку</button><button id="next">Завершити хід →</button><div class="small-controls"><button id="newGame">Нова гра</button><button id="endGame">Завершити гру</button></div></section></aside></main>
<dialog id="modal"><button id="closeModal" class="close" aria-label="Закрити">×</button><div id="modalContent"></div><button id="doneModal" class="primary">Повернутися до поля</button></dialog><div id="notice" class="notice" role="status" hidden></div><script src="script.js?v=2"></script></body></html>
